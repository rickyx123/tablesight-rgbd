[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tablesight-rgbd"
version = "0.1.0"
description = "RGB-D 桌面感知项目复盘与离线计数评估工具"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tablesight-eval = "tablesight.evaluate:main"
tablesight-sampling = "tablesight.sampling:main"

[tool.setuptools.packages.find]
where = ["src"]
